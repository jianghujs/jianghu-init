<!-- ─────────────────────────────────────────────────────────────────────
  jh-mobile-filter-btn

  移动端中继触发按钮（parse_schema：MobileOrder / MobileFilter / MobileAction / MobileSearch 共用）：
  · 始终使用统一圆角 v-btn；showActive 且有摘要时，在按钮内追加单行摘要。
  · 摘要超过统一视觉宽度后自动省略；富文本摘要仍使用 #active-display 插槽。
  · 点击 $emit('click')，例如：@click="isMobileOrderDrawerShown = true"
───────────────────────────────────────────────────────────────────── -->

<script type="text/html" id="jh-mobile-filter-btn-v6-template">
  <span class="jh-mobile-filter-btn inline-flex items-center">
    <v-btn
      small
      :class="['jh-mobile-filter-btn__button', btnClass]"
      @click="handleClick"
    >
      <jh-icon v-if="icon" size="16" class="-ml-0.5 mr-1 flex-shrink-0" :name="icon"></jh-icon>
      <span class="jh-mobile-filter-btn__label">{{ label }}</span>
      <template v-if="showSummaryBlock">
        <span v-if="label" class="jh-mobile-filter-btn__divider">·</span>
        <span class="jh-mobile-filter-btn__active">
          <slot name="active-display">{{ activeDisplay }}</slot>
        </span>
      </template>
    </v-btn>
  </span>
</script>

<style>
.jh-mobile-filter-btn {
  min-width: 0;
  max-width: 100%;
}
.jh-mobile-filter-btn__button.v-btn {
  max-width: 180px;
}
.jh-mobile-filter-btn__button .v-btn__content {
  min-width: 0;
  max-width: 100%;
}
.jh-mobile-filter-btn__label,
.jh-mobile-filter-btn__divider {
  flex: 0 0 auto;
}
.jh-mobile-filter-btn__divider {
  margin: 0px;
  opacity: 0.45;
}
.jh-mobile-filter-btn__active {
  display: block;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 70px;
  overflow: hidden;
  color: inherit;
  font-weight: 500;
  line-height: 1.2;
  opacity: 0.72;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>

<script>
Vue.component('jh-mobile-filter-btn', {
  template: '#jh-mobile-filter-btn-v6-template',
  inheritAttrs: false,
  props: {
    label: { type: String, default: '' },
    btnClass: { type: String, default: '!rounded-xl px-2 border border-solid border-gray-300' },
    showActive: { type: Boolean, default: false },
    /** 与配置里 active / activeDisplayBind 绑定；有 #active-display 插槽时可省略 */
    activeDisplay: { default: undefined },
    icon: { type: String, default: '' },
  },
  computed: {
    hasActiveDisplaySlot() {
      const slot = this.$slots['active-display'];
      return !!(slot && slot.length);
    },
    hasActiveDisplayProp() {
      const v = this.activeDisplay;
      return v != null && v !== '';
    },
    showSummaryBlock() {
      return this.showActive && (this.hasActiveDisplaySlot || this.hasActiveDisplayProp);
    },
  },
  methods: {
    handleClick(e) {
      this.$emit('click', e);
    },
  },
});
</script>
