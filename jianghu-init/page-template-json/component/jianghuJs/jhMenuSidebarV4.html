<script type="text/html" id="jh-menu-sidebar-tpl">
  <div class="jh-sidebar-layout">
    <v-navigation-drawer
      app
      permanent
      :width="sidebarWidth"
      class="jh-sidebar-nav"
      :class="{ 'jh-sidebar-nav--collapsed': isSidebarCollapsed }"
    >
      <div class="jh-sidebar-inner">
        <div class="jh-sidebar-header">
          <span
            v-if="!isSidebarCollapsed"
            class="jh-sidebar-app-title"
          >{{ appTitle }}</span>
          <span
            v-else
            class="jh-sidebar-app-title jh-sidebar-app-title--collapsed"
            :title="appTitle"
          >{{ getAbbr(appTitle, 2) }}</span>
          <button
            type="button"
            class="jh-sidebar-collapse-btn"
            :aria-label="isSidebarCollapsed ? '展开侧边栏' : '收缩侧边栏'"
            :title="isSidebarCollapsed ? '展开侧边栏' : '收缩侧边栏'"
            @click="toggleSidebarCollapsed"
          >
            <span
              class="mdi"
              :class="isSidebarCollapsed ? 'mdi-chevron-double-right' : 'mdi-chevron-double-left'"
              aria-hidden="true"
            ></span>
          </button>
        </div>

        <div class="jh-sidebar-body">
          <button
            v-if="showDirectoryLink"
            type="button"
            class="jh-sidebar-directory-link primary--text"
            :class="{ 'jh-sidebar-directory-link--collapsed': isSidebarCollapsed }"
            tabindex="0"
            aria-label="回到目录"
            @mouseenter="handleCollapsedTipEnter($event, '回到目录')"
            @focus="handleCollapsedTipEnter($event, '回到目录')"
            @mouseleave="handleCollapsedTipLeave"
            @blur="handleCollapsedTipLeave"
            @click="openUrl(appDirectoryLink)"
            @keydown.enter="openUrl(appDirectoryLink)"
          >
            <v-icon size="14" class="jh-sidebar-directory-link__icon">mdi-apps</v-icon>
            <span v-if="!isSidebarCollapsed" class="jh-sidebar-directory-link__text">回到目录</span>
          </button>
 

          <template v-if="!isSidebarCollapsed">
            <div v-for="section in sidebarSections" :key="section.key" class="jh-sidebar-section">
              <div v-if="section.showTitle" class="jh-sidebar-section-title">{{ section.title }}</div>
              <button
                v-for="item in section.items"
                :key="item.pageId"
                type="button"
                class="jh-sidebar-item"
                :class="{ 'jh-sidebar-item--active': currentPageId === item.pageId }"
                :aria-current="currentPageId === item.pageId ? 'page' : null"
                tabindex="0"
                @click="openUrl(item.path, item.query)"
                @keydown.enter="openUrl(item.path, item.query)"
              >
                {{ item.title }}
              </button>
            </div>
          </template>

          <template v-else>
            <div
              v-for="section in sidebarSections"
              :key="'collapsed-' + section.key"
              class="jh-sidebar-section jh-sidebar-section--collapsed"
            >
              <template v-if="section.showTitle">
                <button
                  type="button"
                  class="jh-sidebar-collapsed-trigger"
                  :class="{ 'jh-sidebar-collapsed-trigger--active': isSectionActive(section) }"
                  :aria-label="section.title"
                  @mouseenter="openFlyout($event, section)"
                  @focus="openFlyout($event, section)"
                  @mouseleave="scheduleHideFlyout"
                  @blur="scheduleHideFlyout"
                >
                  {{ getAbbr(section.title, 2) }}
                </button>
              </template>
              <template v-else>
                <button
                  v-for="item in section.items"
                  :key="item.pageId"
                  type="button"
                  class="jh-sidebar-collapsed-trigger"
                  :class="{ 'jh-sidebar-collapsed-trigger--active': currentPageId === item.pageId }"
                  :aria-current="currentPageId === item.pageId ? 'page' : null"
                  :aria-label="item.title"
                  @mouseenter="handleCollapsedTipEnter($event, item.title)"
                  @focus="handleCollapsedTipEnter($event, item.title)"
                  @mouseleave="handleCollapsedTipLeave"
                  @blur="handleCollapsedTipLeave"
                  @click="openUrl(item.path, item.query)"
                  @keydown.enter="openUrl(item.path, item.query)"
                >
                  {{ getAbbr(item.title, 2) }}
                </button>
              </template>
            </div>
          </template>
        </div>

        <div
          class="jh-sidebar-footer"
          :class="{ 'jh-sidebar-footer--collapsed': isSidebarCollapsed }"
        >
          <div
            class="jh-sidebar-user"
            :class="{ 'jh-sidebar-user--interactive': isSidebarCollapsed }"
            :tabindex="isSidebarCollapsed ? 0 : -1"
            :aria-label="userDisplayName"
            @mouseenter="handleUserTipEnter"
            @focus="handleUserTipEnter"
            @mouseleave="handleCollapsedTipLeave"
            @blur="handleCollapsedTipLeave"
          >
            <v-icon size="28" color="grey lighten-1">mdi-account-circle</v-icon>
            <div v-if="!isSidebarCollapsed" class="jh-sidebar-user-meta">
              <span class="jh-sidebar-user-name">{{ userInfo.user.username }}</span>
              <span v-if="userInfo.user.userId" class="jh-sidebar-user-id">ID: {{ userInfo.user.userId }}</span>
            </div>
          </div>
          <button
            type="button"
            class="jh-sidebar-logout-btn"
            :class="{ 'jh-sidebar-logout-btn--collapsed': isSidebarCollapsed }"
            tabindex="0"
            aria-label="退出登录"
            @mouseenter="handleCollapsedTipEnter($event, '退出登录')"
            @focus="handleCollapsedTipEnter($event, '退出登录')"
            @mouseleave="handleCollapsedTipLeave"
            @blur="handleCollapsedTipLeave"
            @click="logout"
            @keydown.enter="logout"
          >
            <span v-if="isSidebarCollapsed" class="mdi mdi-logout" aria-hidden="true"></span>
            <span v-else class="jh-sidebar-logout-btn__text">退出</span>
          </button>
        </div>
      </div>
    </v-navigation-drawer>

    <div
      v-if="isSidebarCollapsed && flyoutSection"
      class="jh-sidebar-flyout jh-sidebar-bubble"
      :style="flyoutStyle"
      @mouseenter="cancelHideFlyout"
      @mouseleave="scheduleHideFlyout"
    >
      <div class="jh-sidebar-bubble__arrow" :style="flyoutArrowStyle"></div>
      <div class="jh-sidebar-flyout__title">{{ flyoutSection.title }}</div>
      <button
        v-for="item in flyoutSection.items"
        :key="'flyout-' + item.pageId"
        type="button"
        class="jh-sidebar-flyout__item"
        :class="{ 'jh-sidebar-flyout__item--active': currentPageId === item.pageId }"
        @click="handleFlyoutItemClick(item)"
      >
        {{ item.title }}
      </button>
    </div>

    <div
      v-if="isSidebarCollapsed && collapsedTip"
      class="jh-sidebar-tip jh-sidebar-bubble"
      :class="{ 'jh-sidebar-tip--with-desc': collapsedTip.desc }"
      :style="collapsedTipStyle"
      role="tooltip"
    >
      <div class="jh-sidebar-bubble__arrow jh-sidebar-bubble__arrow--center"></div>
      <span class="jh-sidebar-tip__label">{{ collapsedTip.label }}</span>
      <span v-if="collapsedTip.desc" class="jh-sidebar-tip__desc">{{ collapsedTip.desc }}</span>
    </div>
  </div>
</script>

<script>
  Vue.component('jh-menu-sidebar', {
    template: '#jh-menu-sidebar-tpl',
    vueComponent: 'jh-menu-sidebar',
    props: {
      showAvatar: { type: Boolean, default: true },
    },
    data() {
      return {
        sidebarExpandedWidth: 256,
        sidebarCollapsedWidth: 56,
        collapsedOverlayHideDelay: 120,
        isSidebarCollapsed: false,
        flyoutSection: null,
        flyoutTop: 0,
        flyoutLeft: 0,
        flyoutAnchorCenterY: 0,
        flyoutHideTimer: null,
        collapsedTip: null,
        collapsedTipTop: 0,
        collapsedTipLeft: 0,
        collapsedTipHideTimer: null,
        appTitle: '<$ ctx.app.config.appTitle $>',
        appDirectoryLink: '<$ ctx.app.config.appDirectoryLink $>',
        userInfo: window.userInfo,
        currentPageId: '',
        currentPageTitle: '',
        sidebarSections: [],
      };
    },
    computed: {
      sidebarWidth() {
        return this.isSidebarCollapsed ? this.sidebarCollapsedWidth : this.sidebarExpandedWidth;
      },
      allowPageList() {
        const pageList = (this.userInfo && this.userInfo.allowPageList) || [];
        if (pageList.some(e => e.pageId.startsWith('mobile/'))) {
          return pageList.filter(e => !e.pageId.startsWith('mobile/'));
        }
        return pageList;
      },
      userDisplayName() {
        const user = this.userInfo && this.userInfo.user;
        return (user && user.username) || '用户';
      },
      showDirectoryLink() {
        if (!window.appInfo || window.appInfo.appId === 'directory') return false;
        const appType = '<$ ctx.app.config.appType $>';
        return appType === 'multiApp' && !!this.appDirectoryLink;
      },
      flyoutStyle() {
        return {
          top: this.flyoutTop + 'px',
          left: this.flyoutLeft + 'px',
        };
      },
      flyoutArrowStyle() {
        var arrowTop = this.flyoutAnchorCenterY - this.flyoutTop - 6;
        return {
          top: Math.max(12, arrowTop) + 'px',
        };
      },
      collapsedTipStyle() {
        return {
          top: this.collapsedTipTop + 'px',
          left: this.collapsedTipLeft + 'px',
        };
      },
    },
    created() {
      this.loadSidebarCollapsedState();
      this.syncCurrentPageId();
      this.buildSidebarSections();
      this.setCurrentMenuItem();
    },
    mounted() {
      this.updateApplicationLayout();
    },
    beforeDestroy() {
      this.cancelHideFlyout();
      this.cancelHideCollapsedTip();
    },
    methods: {
      sidebarCollapsedStorageKey() {
        return (window.appInfo && window.appInfo.appId ? window.appInfo.appId : 'app') + '_sidebarCollapsed';
      },
      loadSidebarCollapsedState() {
        try {
          this.isSidebarCollapsed = localStorage.getItem(this.sidebarCollapsedStorageKey()) === '1';
        } catch (e) {
          this.isSidebarCollapsed = false;
        }
      },
      saveSidebarCollapsedState() {
        try {
          localStorage.setItem(this.sidebarCollapsedStorageKey(), this.isSidebarCollapsed ? '1' : '0');
        } catch (e) {
          // ignore
        }
      },
      toggleSidebarCollapsed() {
        this.isSidebarCollapsed = !this.isSidebarCollapsed;
        this.flyoutSection = null;
        this.collapsedTip = null;
        this.saveSidebarCollapsedState();
        this.updateApplicationLayout();
        this.scheduleTableLayoutRefresh();
      },
      scheduleTableLayoutRefresh() {
        this.$nextTick(function () {
          setTimeout(function () {
            if (typeof window.resetTableMaxHeight === 'function') {
              window.resetTableMaxHeight();
            }
            if (typeof window.reFixedTableCol === 'function') {
              window.reFixedTableCol();
            }
          }, 300);
        });
      },
      getAbbr(text, maxLen) {
        var value = String(text || '').trim();
        if (!value) return '·';
        return value.slice(0, maxLen || 1);
      },
      isSectionActive(section) {
        if (!section || !section.items) return false;
        return section.items.some(item => item.pageId === this.currentPageId);
      },
      openFlyout(event, section) {
        if (!section || !section.showTitle) return;
        this.cancelHideFlyout();
        this.cancelHideCollapsedTip();
        this.collapsedTip = null;
        this.flyoutSection = section;
        var rect = event.currentTarget.getBoundingClientRect();
        this.flyoutTop = rect.top;
        this.flyoutLeft = rect.right + 8;
        this.flyoutAnchorCenterY = rect.top + rect.height / 2;
        this.$nextTick(this.adjustFlyoutPosition);
      },
      adjustFlyoutPosition() {
        var flyoutEl = this.$el && this.$el.querySelector('.jh-sidebar-flyout');
        if (!flyoutEl) return;
        var rect = flyoutEl.getBoundingClientRect();
        var maxBottom = window.innerHeight - 12;
        if (rect.bottom > maxBottom) {
          this.flyoutTop = Math.max(12, this.flyoutTop - (rect.bottom - maxBottom));
        }
      },
      scheduleHideFlyout() {
        this.cancelHideFlyout();
        var self = this;
        this.flyoutHideTimer = setTimeout(function () {
          self.flyoutSection = null;
        }, this.collapsedOverlayHideDelay);
      },
      cancelHideFlyout() {
        if (this.flyoutHideTimer) {
          clearTimeout(this.flyoutHideTimer);
          this.flyoutHideTimer = null;
        }
      },
      handleFlyoutItemClick(item) {
        this.flyoutSection = null;
        this.openUrl(item.path, item.query);
      },
      handleCollapsedTipEnter(event, label, desc) {
        if (!this.isSidebarCollapsed || !label) return;
        this.openCollapsedTip(event, label, desc);
      },
      handleCollapsedTipLeave() {
        if (!this.isSidebarCollapsed) return;
        this.scheduleHideCollapsedTip();
      },
      handleUserTipEnter(event) {
        if (!this.isSidebarCollapsed) return;
        const user = this.userInfo && this.userInfo.user;
        if (!user) return;
        const desc = user.userId ? ('ID: ' + user.userId) : '';
        this.openCollapsedTip(event, user.username || '用户', desc);
      },
      openCollapsedTip(event, label, desc) {
        if (!label) return;
        this.cancelHideCollapsedTip();
        this.cancelHideFlyout();
        this.flyoutSection = null;
        const rect = event.currentTarget.getBoundingClientRect();
        this.collapsedTip = {
          label: label,
          desc: desc || '',
        };
        this.collapsedTipTop = rect.top + rect.height / 2;
        this.collapsedTipLeft = rect.right + 8;
      },
      scheduleHideCollapsedTip() {
        this.cancelHideCollapsedTip();
        const self = this;
        this.collapsedTipHideTimer = setTimeout(function () {
          self.collapsedTip = null;
        }, this.collapsedOverlayHideDelay);
      },
      cancelHideCollapsedTip() {
        if (this.collapsedTipHideTimer) {
          clearTimeout(this.collapsedTipHideTimer);
          this.collapsedTipHideTimer = null;
        }
      },
      updateApplicationLayout() {
        this.$nextTick(() => {
          const application = this.$root && this.$root.$vuetify && this.$root.$vuetify.application;
          if (!application || typeof application.update !== 'function') return;
          if (!application.locations || typeof application.locations !== 'object') return;
          try {
            application.update();
          } catch (err) {
            // v-app 尚未完成注册时忽略
          }
        });
      },
      syncCurrentPageId() {
        const urlPathList = window.location.pathname.split('/page/');
        this.currentPageId = urlPathList[urlPathList.length - 1] || '';
      },
      buildSidebarSections() {
        const menuListResource = _
          .chain(this.allowPageList)
          .filter(page => _.includes(['showInMenu', 'link'], page.pageType)
            || (_.includes(['dynamicInMenu', 'avatarInMenu'], page.pageType) && this.currentPageId === page.pageId))
          .orderBy([page => parseInt(page.sort, 10) || 0], ['asc'])
          .value();

        const sectionMap = {};
        const ungroupedItems = [];

        menuListResource.forEach(page => {
          const pageSort = parseInt(page.sort, 10) || 0;
          const item = {
            path: page.pageType === 'link' ? page.pageFile : `/${window.appInfo.appId}/page/${page.pageId}`,
            pageId: page.pageId,
            title: page.pageName,
            query: null,
            sort: pageSort,
          };

          if (page.pageName.startsWith('[')) {
            const inner = page.pageName.substring(1);
            const splitIndex = inner.indexOf(']');
            if (splitIndex > 0) {
              const sectionTitle = inner.substring(0, splitIndex);
              item.title = inner.substring(splitIndex + 1) || page.pageName;

              if (!sectionMap[sectionTitle]) {
                sectionMap[sectionTitle] = {
                  key: `group-${sectionTitle}`,
                  title: sectionTitle,
                  showTitle: true,
                  items: [],
                  minSort: Infinity,
                };
              }
              sectionMap[sectionTitle].minSort = Math.min(sectionMap[sectionTitle].minSort, pageSort);
              sectionMap[sectionTitle].items.push(item);
              return;
            }
          }

          ungroupedItems.push(item);
        });

        const sections = Object.values(sectionMap);

        if (ungroupedItems.length > 0) {
          ungroupedItems.sort((a, b) => a.sort - b.sort);
          sections.push({
            key: 'flat-menu',
            title: '',
            showTitle: false,
            items: ungroupedItems,
            minSort: Math.min(...ungroupedItems.map(item => item.sort)),
          });
        }

        this.sidebarSections = sections.sort((a, b) => a.minSort - b.minSort);
      },
      setCurrentMenuItem() {
        let foundTitle = '';
        this.sidebarSections.forEach(section => {
          section.items.forEach(item => {
            if (item.pageId === this.currentPageId) {
              foundTitle = item.title;
            }
          });
        });
        this.currentPageTitle = foundTitle;
        document.title = this.appTitle + (foundTitle ? ` - ${foundTitle}` : '');
      },
      openUrl(url, queryParams) {
        if (queryParams) {
          const queryStrings = Object.keys(queryParams)
            .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(queryParams[k])}`)
            .join('&');
          window.location.href = `${url}?${queryStrings}`;
          return;
        }
        if (url.split('/page/')[1] === this.currentPageId) {
          const page = this.userInfo.allowPageList.find(item => item.pageId === this.currentPageId);
          if (page && page.pageType === 'dynamicInMenu') {
            location.reload();
            return;
          }
        }
        window.location.href = url;
      },
      async logout() {
        try {
          await window.jianghuAxios({ data: { appData: { pageId: 'allPage', actionId: 'logout' } } });
          vtoast.success('注销成功');
          this.routeToLoginPage();
        } catch (error) {
          vtoast.fail(error.errorReason);
          this.routeToLoginPage();
        }
      },
      routeToLoginPage() {
        localStorage.removeItem(`${window.appInfo.authTokenKey}_authToken`);
        setTimeout(() => { location.href = '<$ ctx.app.config.loginPage $>'; }, 700);
      },
    },
  });
</script>
